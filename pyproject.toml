[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "singapore-gp-pit-strategy-sim"
version = "0.2.0"
description = "Stochastic Monte Carlo and DTMC pit-strategy simulator for the Singapore Grand Prix"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    "statsmodels>=0.14.0",
]

[project.optional-dependencies]
data = ["fastf1>=3.3.0"]
dev = ["jupyter>=1.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
